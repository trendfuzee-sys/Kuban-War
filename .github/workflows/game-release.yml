name: Publish game update
on:
  push:
    branches: [main]
    paths: ['game-update/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kuban-game-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f game-update/version.txt
          version=$(tr -d '\r\n' < game-update/version.txt)
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Version already published"; exit 0
          fi
          base=$(gh release list --exclude-drafts --exclude-pre-releases --limit 30 --json tagName --jq '.[].tagName' | while read -r tag; do
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq KubanWar.zip; then echo "$tag"; break; fi
          done)
          test -n "$base"
          gh release download "$base" --pattern KubanWar.zip --dir /tmp/kuban-base
          python3 tools/apply_game_update.py /tmp/kuban-base/KubanWar.zip game-update KubanWar.zip
          gh release create "$version" KubanWar.zip --target "$GITHUB_SHA" --title "Kuban War $version" --notes-file game-update/notes.txt --latest
