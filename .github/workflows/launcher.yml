name: Build Windows launcher
on:
  workflow_dispatch:
  push:
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract original media without executing old launcher
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.0 --pattern KubanWarLauncher.exe --dir "$env:RUNNER_TEMP\classic"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python launcher/extract_classic_assets.py "$env:RUNNER_TEMP\classic\KubanWarLauncher.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile
        shell: cmd
        run: launcher\build.cmd
      - name: Self-signed Authenticode integrity signature
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Subject 'CN=Kuban War (Self-Signed)' -Type CodeSigningCert -CertStoreLocation 'Cert:\CurrentUser\My' -KeyAlgorithm RSA -KeyLength 3072 -HashAlgorithm SHA256 -KeyExportPolicy NonExportable -NotAfter (Get-Date).AddYears(1)
          try {
            $sig = Set-AuthenticodeSignature -FilePath launcher/KubanLauncher.exe -Certificate $cert -HashAlgorithm SHA256
            if ($null -eq $sig.SignerCertificate -or $sig.SignerCertificate.Thumbprint -ne $cert.Thumbprint) { throw 'Signature missing or incorrect' }
            Export-Certificate -Cert $cert -FilePath launcher/KubanWar-Publisher.cer | Out-Null
            Write-Host "Authenticode status: $($sig.Status); self-signed, not publicly trusted"
          } finally {
            Remove-Item -Path ("Cert:\CurrentUser\My\" + $cert.Thumbprint)
          }
      - uses: actions/upload-artifact@v4
        with:
          name: KubanLauncher-Windows
          path: |
            launcher/KubanLauncher.exe
            launcher/KubanWar-Publisher.cer
          if-no-files-found: error

      - name: SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash launcher/KubanLauncher.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  KubanLauncher.exe" | Set-Content -Encoding ascii launcher/SHA256SUMS.txt
      - name: Publish launcher download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'launcher-v2.1.1'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title 'Kuban Launcher Classic 2.1.1' --notes 'Source-built classic launcher with original media and incremental file updates. Self-signed Authenticode; not publicly trusted. Antivirus verification pending.' --latest=false
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag launcher/KubanLauncher.exe launcher/SHA256SUMS.txt launcher/KubanWar-Publisher.cer --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
