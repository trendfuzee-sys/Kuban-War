name: Build Windows launcher
on:
  workflow_dispatch:
  push:
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        shell: cmd
        run: launcher\build.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: KubanLauncher-Windows
          path: launcher/KubanLauncher.exe
          if-no-files-found: error
