else if(c.mode==='economy'){gold[0]=340}prepareCampaignChallenge(a,c,h,enemy);if(mobileModes.has(a.mode)){E=E.filter(u=>u.team!==1||u.k!=='b'||a.points.some(p=>p.target===u)||u===a.object);for(const p of a.points){Object.assign(p,campaignFree(p.x,p.y));}}if(c.seq===23||c.seq>=24&&c.seq<28){const u=unit(0,'bog',1,x+70,y);Object.assign(u,{nm:'Араб',arab:true,mh:ARS.hp,hp:ARS.hp,dmg:ARS.dmg,ar:ARS.ar,sp:ARS.sp});ARAB[0]=1}if(c.seq>=26&&c.seq<28){const u=unit(0,'bog',2,x+90,y+35);Object.assign(u,{roommate:true,nm:'Сожитель',mh:650,hp:650,dmg:42})}if(['defend','evacuate','counter'].includes(a.mode))setupSiege(a,c,h,enemy);factionReset();showTalk(c.lines);hud.p=''};
ai=function(dt){if(!scenario||scenario.mode==='boss')return storyAI(dt);const a=scenario;if(mobileModes.has(a.mode)){campaignPatrol(dt,a);return;}if(a.siege)return siegeAI(dt,a);return storyAI(dt)};
function statusText(){const a=scenario,c=CAM[a.id];let line=a.mode==='raid'?'Разгромите все отмеченные гарнизоны':c.tx;if(a.siege)return siegeStatus(a);if(!['boss','economy','defend','capture','raid','rescue','dungeon','escort','evacuate'].includes(a.mode))line='Уничтожьте все вражеские здания'+(a.mode==='counter'?' после отражения атаки':'')+' · Осталось: '+E.filter(u=>u.team===1&&u.k==='b'&&!u.dead).length;if(a.mode==='economy')line+=` · Добыто ${Math.floor(a.mined||0)}/1000 · Запас ${Math.floor(gold[0])}/350 · Бойцы ${E.filter(u=>u.team===0&&u.k==='u'&&!u.dead&&!u.wk&&u.i!==9&&!u.arab).length}/6 · Рабочие ${E.filter(u=>u.team===0&&!u.dead&&u.wk).length}/8 · Казарма, дом и башня`;if(a.duration&&t<a.duration)line+=` · ${Math.ceil(a.duration-t)} с`;if(a.mode==='evacuate'&&t>=a.duration)line='Отведите Данила к пункту эвакуации';if(a.points.length)line+=` · ${a.points.filter(p=>p.done).length}/${a.points.length}`;if(a.mode==='raid')line+=' · Уничтожьте гарнизоны: '+a.points.reduce((n,p)=>n+(p.guards||[]).filter(u=>!u.dead).length,0)+' врагов осталось';else if(a.points.length)line+=' · '+(a.mode==='escort'?'Обоз':'Герой')+' у отметки, сопровождающие бойцы (до 2 из выживших)';if(a.mode==='capture')line+=' · Удерживайте каждую точку '+(a.holdRequired||8)+' с без врагов';if(a.deadline)line+=` · ${Math.max(0,Math.ceil(a.deadline-t))} с`;return line}
chk=function(){const a=scenario;if(!a||a.mode==='boss')return storyCheck();if(!run||a.finished||talk)return;const h=E.find(u=>u.team===0&&u.i===9&&!u.dead),base=E.some(u=>u.team===0&&u.ty==='h'&&!u.dead);if(a.siege){if(!base||!h)return end(0);if(a.wave>=a.siege.count&&!E.some(u=>u.team===1&&u.k==='u'&&!u.dead)){if(a.mode!=='evacuate')return end(1);a.duration=0}else return;}if(!h&&(mobileModes.has(a.mode)||a.mode==='evacuate')||!base&&!mobileModes.has(a.mode)&&!(a.mode==='evacuate'&&t>=a.duration))return end(0);if(a.deadline&&t>a.deadline)return end(0);if(a.cargo?.dead)return end(0);for(const p of a.points){if(p.done||!h||p.target&&!p.target.dead)continue;if(a.points.slice(0,a.points.indexOf(p)).some(q=>!q.done)&&a.mode!=='capture')continue;const actor=a.mode==='escort'?a.cargo:h;if(a.mode==='evacuate'&&t<a.duration)continue;const support=E.filter(u=>u.team===0&&u.k==='u'&&!u.dead&&!u.wk&&u.i!==9&&u!==a.cargo&&D(u,p)<190).length;const clear=(a.mode==='capture'?E.filter(u=>u.team===0&&fateSoldier(u)&&D(u,p)<190).length>=4:actor&&!actor.dead&&D(actor,p)<115&&support>=Math.min(2,E.filter(u=>u.team===0&&u.k==='u'&&!u.dead&&!u.wk&&u.i!==9&&u!==a.cargo).length))&&!E.some(u=>u.team===1&&u.k==='u'&&!u.wk&&!u.dead&&D(u,p)<125);if(a.mode==='raid'&&p.guards?.every(u=>u.dead)){p.done=true;toast(p.name+' — гарнизон разбит');continue}if(a.mode==='capture'){p.hold=clear?(p.hold||0)+1:0;if(p.hold<(a.holdRequired||8))continue}if(clear){p.done=true;if(a.mode==='rescue'){const q=campaignFree(p.x+35,p.y+20);unit(0,mis.p,0,q.x,q.y)};toast(p.name+' — выполнено');missionRadio(castSpeaker(a.id),missionEvent(a,p))}}const all=a.points.every(p=>p.done);if(!a.mid&&t>35){a.mid=true;missionRadio(castSpeaker(a.id),'Продолжаем. '+statusText());}if(a.mode==='economy'){if((a.mined||0)>=1000&&gold[0]>=350&&E.filter(u=>u.team===0&&!u.dead&&u.wk&&!u.militia).length>=8&&E.filter(u=>u.team===0&&u.k==='u'&&!u.dead&&!u.wk&&u.i!==9&&!u.arab).length>=6&&['b','t','s'].every(ty=>E.some(u=>u.team===0&&u.ty===ty&&u.pg>=1&&!u.dead)))end(1);return}if(a.mode==='defend'){if(t>=a.duration)end(1);return}if(a.mode==='counter'&&t<a.duration)return;if(a.mode==='dungeon'&&all&&(!a.guard||a.guard.dead)&&(!a.object||a.object.dead))return end(1);if(['capture','rescue','escort','evacuate','raid'].includes(a.mode)&&all)return end(1);if(mobileModes.has(a.mode)||a.mode==='capture'||a.mode==='evacuate')return;if(!E.some(u=>u.team===1&&u.k==='b'&&!u.dead))return end(1);return};
hud=function(){storyHud();if(run&&scenario&&scenario.mode!=='boss'){$('obj').replaceChildren();const h=document.createElement('h4');h.textContent='Задания';const b=document.createElement('div');b.textContent=statusText();$('obj').append(h,b);if(scenario.mode==='escort'){const q=document.createElement('small');q.textContent='Выделите обоз и отдайте приказ двигаться к отметке.';$('obj').append(q)}}};
draw=function(){storyDraw();if(!run||!scenario||scenario.mode==='boss')return;g.save();g.setTransform(S*Z,0,0,S*Z,-cam.x*S*Z,-cam.y*S*Z);for(const p of scenario.points){if(p.done)continue;g.strokeStyle='#f5d173';g.lineWidth=3;g.beginPath();g.arc(p.x,p.y,42,0,7);g.stroke();g.font='bold 15px Arial';g.fillStyle='#fff0b2';g.strokeStyle='#151713';g.lineWidth=4;g.strokeText(p.name,p.x-35,p.y-48);g.fillText(p.name,p.x-35,p.y-48)}g.restore()};
const endings={"0":[["Казак","Лагерь разбит, но у них нашлись припасы сразу из нескольких станиц. Значит, эта шайка далеко не единственная.","Сдержанно"],["Данил","Значит, у них есть ещё лагеря. Отлично, придётся собирать ополчение. Только пусть никто не думает, что я буду за свой счёт возвращать добро всей Кубани.","Самоуверенно"],["Казак","Ты говоришь так, будто мы нанялись искать одну бочку.","Сдержанно"]],"1":[["Дозорный","Вражеские лагеря уничтожены. Но пленники говорят, что Кровчински собирается ударить ночью, пока мы празднуем.","Сдержанно"],["Данил","Праздник отменяется. Они знают, где мой дом. Укрепляйте станицу — я не намерен второй раз покупать себе новый замок.","Самоуверенно"],["Дозорный","Тогда надеюсь, твой дом стоит всех этих ночей.","Сдержанно"]],"2":[["Дозорный","Они отступили. На дороге остались следы грузовика с нашими припасами. Следы ведут к студенческому городку.","Сдержанно"],["Данил","Студенты? Вот и выясним, кто решил поживиться моим добром. Если вернут груз, пусть живут как хотят.","Раздражённо"],["Казак","Только не начинай ещё одну войну из-за одного грузовика.","Сдержанно"]],"3":[["Богдан","Запомню, Данил. Сегодня ты забрал припасы, завтра мои ребята придут за своим.","С досадой"],["Данил","Запоминай сколько угодно. Я своё забрал. В следующий раз не строй из себя благодетеля за мой счёт.","Самоуверенно"],["Богдан","Вот и запомни этот момент. Не всё на свете принадлежит тебе.","С досадой"]],"4":[["Казак","В захваченных вещах нашли схему старого промышленного комплекса. Там, похоже, и прячутся основные силы Кровчински.","Сдержанно"],["Данил","Под заводом полно ходов. Возьму небольшой отряд: не хочу кормить целую армию, пока ищу одного полутрупа.","Самоуверенно"],["Казак","Я пойду. Но если там засада, не оставляй нас под землёй.","Сдержанно"]],"5":[["Казак","Землю тряхнуло, аж пыль с потолка посыпалась. Но проход теперь свободен.","Сдержанно"],["Данил","Потолок трясётся, зато дорога свободна. Выходим, пока этот подвал не стал моей могилой.","Самоуверенно"],["Казак","Мне не нравится этот звук. Будто что-то отозвалось далеко внизу.","Сдержанно"]],"6":[["Казак","Штаб рухнул. Кровчински остался под завалами, его люди разбегаются. Большую часть украденного добра нашли.","Сдержанно"],["Данил","Вот теперь можно домой. Бочку так и не нашли, но хотя бы Кровчински больше не будет рассказывать, кто здесь хозяин. И пусть никто не забудет, кому обязан победой.","Самоуверенно"],["Казак","Победой? А кто будет объяснять семьям, почему не все вернулись?","С сомнением"]],"7":[["Беглец","Выбрались. Нашли ещё людей и немного припасов. Но на целую армию этого не хватит.","Сдержанно"],["Кровчински","Вон свалка за дорогой. Пока одни видят мусор, мы увидим деньги. Начнём всё заново.","С напряжением"],["Беглец","С нуля, значит. Ну хоть живыми. Почти.","Сдержанно"]],"8":[["Рабочий","Казарма готова, деньги есть. Но спиртное заканчивается быстрее, чем мы успеваем его покупать.","Сдержанно"],["Кровчински","Значит, пора перестать зависеть от торговцев. Слышал, неподалёку есть старый спиртзавод.","С напряжением"],["Рабочий","Никогда не думал, что буду так рад виду пустой бутылки.","Сдержанно"]],"9":[["Рабочий","Насос работает. Давление восстановилось, можно наладить производство. Только гудит он подозрительно громко.","Сдержанно"],["Кровчински","Пускай гудит. Теперь у нас есть чем поддерживать армию. Пора забрать товарищей, которых после побега снова посадили.","С напряжением"],["Рабочий","Ладно. Только этот гул я ещё долго буду слышать во сне.","Сдержанно"]],"10":[["Заключённый","Все группы на свободе. А вот и твоё личное дело, начальник. Что с ним делать?","С сомнением"],["Кровчински","Уничтожь. Пусть больше никто не решает по этой папке, как мне жить. Возвращаемся на завод: теперь есть кому его защищать.","С напряжением"],["Заключённый","Наконец-то можно не спрашивать разрешения выйти во двор.","Сдержанно"]],"11":[["Беглец","Орда отступила, но оружия у нас осталось мало. Следующий удар может оказаться последним.","Сдержанно"],["Кровчински","Нужны поставщики. Говорят, с побережья приехали торговцы, готовые платить за груз со старых складов.","С напряжением"],["Беглец","Только бы новые хозяева не оказались хуже старых.","Сдержанно"]],"12":[["Торговец","Всё на месте, включая документы. Вот обещанная плата. Было приятно иметь с вами дело.","Сдержанно"],["Кровчински","Наконец есть чем вооружить армию. Осталось выбить тех, кто до сих пор считает Новотитаровку своей собственностью.","С напряжением"],["Беглец","Странный человек. Даже не пересчитал груз при нас.","Сдержанно"]],"13":[["Кровчински","Объявляю Новотитаровскую республику независимой. Первый указ: никаких вытрезвителей. Второй — завод работает на наших людей.","С напряжением"],["Беглец","За свободу, начальник! Теперь нас обратно за решётку никто не загонит.","Взволнованно"],["Кровчински","Только не называй меня начальником. Хотя… ладно, сегодня можно.","С напряжением"]],"14":[["Всадник","Перевал за нами. Впереди земли, о которых рассказывал торговец. Видны укрепления местных.","Сдержанно"],["Субидей","Хорошо. Теперь нам нужна ставка, где всадники смогут отдыхать, а работники — добывать ресурсы.","С гордостью"],["Всадник","Я впервые вижу столько земли без степной пыли.","Сдержанно"]],"15":[["Всадник","Лагерь стоит, ближайшие укрепления разбиты. Жители спрашивают, кому теперь платить за защиту.","Сдержанно"],["Субидей","Нам. Пора объяснить соседним поселениям, что Орда пришла не на один день.","С гордостью"],["Всадник","Надеюсь, они не решат, что сменили одного сборщика на другого.","Сдержанно"]],"16":[["Всадник","Поселения подчинились. Старики рассказали о необычной траве в глубине болота. Говорят, она лечит лучше любой другой.","Сдержанно"],["Субидей","Тогда отправимся туда. С такой находкой наша армия станет куда выносливее.","С гордостью"],["Всадник","Хан, только не говори старику, что мы пришли за всем корнем.","Сдержанно"]],"17":[["Всадник","Корень вытащили, но часть болота ушла под землю. Ещё немного — и нас бы затянуло следом.","Сдержанно"],["Субидей","Значит, старик был прав насчёт почвы. Зато у нас редкая трава. Уходим по сухой тропе, пока она ещё существует.","С гордостью"],["Всадник","Я не хочу больше слышать, как земля дышит под копытами.","Сдержанно"]],"18":[["Всадник","Натиск отбит. Торговцы с побережья предлагают деньги за охрану караванов и поставки травы.","Сдержанно"],["Субидей","Отлично. Откроем дорогу к морю и обеспечим Орде новый источник богатства.","С гордостью"],["Всадник","Наконец-то дорога, на которой не придётся каждый день воевать. Надеюсь.","Сдержанно"]],"19":[["Торговец","Груз доставлен. Получите вознаграждение, как обещано.","Сдержанно"],["Субидей","Теперь хватит средств для решающего похода. Пока крупнейшее казачье укрепление стоит, власть Орды на Кубани никто не признает.","С гордостью"],["Всадник","Тогда пусть это будет последний поход за чужими стенами.","Сдержанно"]],"20":[["Всадник","Крепость наша, великий хан. Только колодезная вода стала солёной, да и припасов почти не осталось. Слышите этот шум вдали?","С сомнением"],["Субидей","До моря ещё далеко. Наверное, ветер. Сегодня пируем, завтра отправим людей искать новые земли. Кубань теперь наша.","С гордостью"],["Всадник","Я бы предпочёл сначала найти пресную воду, великий хан.","Сдержанно"]],"21":[["Студент","Налётчики ушли. Только у ворот уже какие-то всадники спрашивали, сколько человек здесь живёт.","Сдержанно"],["Богдан","Если ещё и за проживание хану платить предложат, я точно превращу общагу в крепость.","С досадой"],["Студент","А я надеялся хотя бы сегодня выспаться.","Сдержанно"]],"22":[["Студент","Вражеский лагерь разбит. Но во время боя повредили линию связи, интернет пропал во всём здании.","Сдержанно"],["Богдан","Всё. Это уже личное. Собирай отряд, выясним, где они порвали кабель.","С досадой"],["Студент","Без интернета я ещё проживу. Без этих ребят — не знаю.","Сдержанно"]],"23":[["Араб","Узел нашли. Но линия уходит под общагу, а схема заканчивается там, где должен быть обычный подвал.","С тревогой"],["Богдан","Значит, спустимся туда. Только не говори ботанам, что мы опять полезем к их экспериментам.","С досадой"],["Араб","И на этот раз не отходи от меня.","С тревогой"]],"24":[["Араб","Дверь нашли. За ней что-то есть, но я бы не открывал её, пока не поймём, что именно.","С тревогой"],["Богдан","Согласен. Сначала наверх. Если нас снова атакуют, решать придётся быстро.","С досадой"],["Араб","Пообещай, что не откроешь её один.","С тревогой"]],"25":[["Араб","Свет погас по всему зданию. Земля дрожит. Богдан, он вышел... Ты видишь, каким он стал?","С тревогой"],["Богдан","Вижу. И вижу, что враги отступают. Сначала спасаем общагу. Потом спросим у него, что это было.","С досадой"],["Араб","Богдан, я не уверен, что он нас вообще слышит.","С тревогой"]],"26":[["Араб","Укрепления уничтожены. Сожитель снова смотрел куда-то вдаль, словно вообще не слышал нас.","С тревогой"],["Богдан","Осталось последнее сражение. После него никто больше не будет нас трогать. Тогда разберёмся со всем остальным.","С досадой"],["Араб","Ты говоришь это уже третий раз. Я боюсь, что последнего боя не будет.","С тревогой"]],"27":[["Богдан","Сожитель! Всё, возвращаемся домой. Эй, ты куда? Я с тобой разговариваю!","Тревожно"],["Араб","Он смотрит в сторону моря. Не отвечает. Богдан, не иди за ним один.","С тревогой"],["Богдан","Араб… если он вернётся, не открывай дверь без меня.","С досадой"],["Рассказчик","Ночью у побережья пропала связь с несколькими пристанями. Из колодцев потянуло солью, а над морем раздался долгий корабельный гудок.","За кадром"]],"28":[["Дозорный","Данил, в тумане видны корабли. Шторм затопил низины у берега, но в глубине Кубани ещё сухо. Что будем делать?","С сомнением"],["Данил","Придётся искать остальных. Не потому, что я по ним соскучился. Просто одному мне через это не пробиться.","Самоуверенно"],["Казак","Никогда не думал, что буду рад увидеть ордынцев.","Сдержанно"]],"29":[["Субидей","Не думал, что когда-нибудь поставлю своих всадников рядом с казаками.","С гордостью"],["Кровчински","А я не думал, что буду рад видеть Данила живым. Давайте хотя бы сегодня не убивать друг друга.","С напряжением"],["Богдан","Вот и договорились. Хотя бы до рассвета.","С досадой"]],"30":[["Рассказчик","У разрушенных укреплений появляется Адмирал Эстон. Рядом с ним стоит Сожитель.","За кадром"],["Богдан","Сожитель! Ты слышишь меня? Иди сюда. Мы же вместе столько пережили!","Тревожно"],["Адмирал Эстон","Забавно. Столько лет держал его у себя и даже не поинтересовался, что это такое.","Холодное спокойствие"],["Данил","Отходим! Я не собираюсь оставаться под этими стенами. Эстон ещё ответит за то, что здесь устроил.","Раздражённо"],["Богдан","Он даже не посмотрел на меня. Что я сделал?..","С досадой"]],"31":[["Богдан","Путь к порту открыт. Данил, не обещай, что вернёшься. Просто сделай всё, что можешь.","С досадой"],["Данил","Не волнуйся, Богдан. Я не собираюсь умирать ради красивой речи. Удержи берег, чтобы мне было куда возвращаться.","Самоуверенно"],["Кровчински","Данил, если вернёшься, я даже не потребую денег за свой штаб. Мы с остальными удержим причал и подготовим отход.","С напряжением"]],"32":[["Казак","Флагман тонет. Адмирал больше не отвечает.","Сдержанно"],["Данил","Вот и всё. Забираем людей и домой. Я своё отвоевал.","Самоуверенно"]]};
const finale=[['Адмирал Эстон','Наконец…','Едва слышно'],['Казак','Флагман разваливается! Адмирал исчез под водой. Отходим к причалу!','Тревожно'],['Данил','Пускай тонет. Я не собираюсь нырять за его трупом.','Самоуверенно'],['Рассказчик','Экспедиция вернулась на берег. Шторм стих, морские отряды исчезли. Временное перемирие позволило уцелевшим вернуться домой.',''],['Данил','Теперь уж точно займусь своим домом. Остальные пусть разбираются со своими делами сами.','Сдержанно']];
end=function(win){if(!scenario||!run)return storyEnd(win);if($('missionRadio'))$('missionRadio').hidden=true;const a=scenario;if(a.finished)return;a.finished=true;const c=CAM[a.id];const finish=()=>{const h=E.find(u=>u.team===0&&u.i===9&&!u.dead);if(win){if(h)storySave.heroes[a.id]=snap(h);if(!storyDone(a.id))storySave.done.push(a.id);persistStory()}storyEnd(win);const n=nextChapter(a.id);$('mw').innerHTML=`<h1>${win?(a.id===4?'Адмирал повержен':'Задание выполнено'):'Поражение'}</h1><div class=card>${win?(a.id===4?'Флагман уничтожен. Пора возвращаться домой.':'Глава завершена.'):'Попробуйте снова.'}</div>${win&&n>=0?`<button class=b data-go2=${n}>Следующая глава</button>`:''} <button class=b data-go2=${a.id}>Повторить</button> <button class=b data-m=c>Кампания</button>`;scenario=null};if(win)playInterlude(a.id,a.id===4?finale:(endings[c.seq]||[[c.lines[0][0],'С этим разобрались. Двигаемся дальше.']]),finish);else finish()};
menu=function(...args){if($('missionRadio'))$('missionRadio').hidden=true;if(talk){talk=null;dialog.hidden=true}scenario=null;return storyMenu(...args)};


function castSpeaker(id){return ({kaz:'Данил',nov:'Кровчински',mon:'Субидей',bog:'Богдан'})[CAM[id].p]||'Дозорный'}
function missionEvent(a,p){const seq=CAM[a.id].seq;const last=a.points.every(q=>q.done);if(last&&seq===5)return 'Проход открыт. Землю тряхнуло — держитесь подальше от потолка.';if(last&&seq===9)return 'Насос заработал. Теперь завод снова наш.';if(last&&seq===17)return 'Корень у нас. Выбираемся из болота.';if(last&&seq===24)return 'Дверь найдена. Не трогайте её без меня.';if(a.mode==='rescue')return 'Нашли людей у объекта «'+p.name+'». Продолжаем поиски.';if(a.mode==='capture')return 'Объект «'+p.name+'» под нашим контролем.';return last?'Цель достигнута. Проверяем, все ли на месте.':'Путь через «'+p.name+'» открыт. Двигаемся дальше.'}
let radioTimer;function missionRadio(who,msg){let el=$('missionRadio');if(!el){el=document.createElement('aside');el.id='missionRadio';document.body.append(el)}el.replaceChildren();const h=document.createElement('b'),p=document.createElement('div');h.textContent=who;p.textContent=msg;el.append(h,p);el.hidden=false;clearTimeout(radioTimer);radioTimer=setTimeout(()=>el.hidden=true,6500)}

отя бы подготовишь людей к опасностям болота?", "Дай нам советы и травы. За припасы заплачу.", "Оставим лишний груз у тебя за небольшую плату.", "Пусть всадники разведают проходы, прежде чем мы двинемся."], "19": ["Всадник", "Что делать с запасами перед нападением с двух сторон?", "Раздать защитникам. Орда не бросает верных.", "Собрать в казну всё, что можно обменять на золото.", "Подготовить смены дозоров и встречать врагов сообща."], "20": ["Торговец", "Какую поддержку выбрать для каравана?", "Дайте проводникам провизию. Без них мы заблудимся.", "Выдайте аванс золотом, остальное после доставки.", "Покажите безопасные позиции для стрелков и охраны."], "21": ["Всадник", "Что сказать войску перед последним рубежом?", "После победы верные получат обещанное. Сейчас берегите друг друга.", "Соберите остатки добычи в казну хана.", "Победит не самый богатый, а тот, кто удержит строй."], "22": ["Студент", "Богдан, как нам собраться и не разбежаться?", "Раздадим еду и воду. Держитесь вместе, ребята.", "Скинемся на снаряжение. Иначе нам нечем будет отбиваться.", "Соберёмся группами и прикроем друг друга."], "23": ["Ботан", "На что потратить последние ресурсы общаги?", "Часть на припасы для ребят. Мы не казарма.", "Обменяем лишнее имущество на золото для строительства.", "Подготовим оборону и распределим роли."], "24": ["Араб", "Ты на этот раз будешь слушать меня?", "Буду. Спасибо, что не бросаешь меня, даже когда я не прав.", "Сначала соберём деньги на оборудование, потом будем спорить.", "Договорились: движемся парами и прикрываем друг друга."], "25": ["Араб", "Как подготовимся к спуску?", "Возьми запас припасов. Я не хочу тебя потерять.", "Продадим лишние вещи, чтобы купить снаряжение.", "Проверим углы и проходы. Никто не идёт один."], "26": ["Араб", "Что скажем ребятам перед тем, как открыть дверь?", "Скажем правду: я боюсь, но не брошу их.", "Попросим собрать оставшиеся деньги на оборону.", "Прикажем держать позиции и не бросаться за Сожителем."], "27": ["Араб", "Если Сожитель снова перестанет слушаться, что будем делать?", "Держись рядом. Я не хочу потерять ещё и тебя.", "Соберём резерв средств на случай отступления.", "Держим строй отдельно от него. Не полагаемся на одну силу."], "28": ["Араб", "Что для тебя важнее всего в этом последнем бою?", "Вернуть своих домой. Победа без них мне не нужна.", "Собрать средства, чтобы восстановить общагу после боя.", "Закончить бой организованно и не позволить окружить нас."], "29": ["Дозорный", "Как распределить оставшиеся припасы, Данил?", "Выдай их отряду. Одному мне отсюда не выбраться.", "Собери ценности уцелевших. В дороге пригодится золото.", "Организуй охрану и не позволяй людям разбегаться."], "30": ["Кровчински", "Какую гарантию ты можешь дать, что не ударишь нам в спину?", "Пока выбираемся отсюда, твои люди под моей защитой. Мне это выгодно.", "Гарантия простая: каждый вносит золото в общую казну.", "Держим общий строй. Кто нарушит договор, сам останется в тумане."], "31": ["Богдан", "Поможешь прикрыть эвакуацию или опять думаешь только о себе?", "Помогу. Если вы погибнете, мне одному не выбраться.", "Пусть уцелевшие передадут часть средств на оборону.", "Распределим сектора и будем отходить по очереди."], "32": ["Араб", "Перед выходом к порту: как будем действовать вместе?", "Обменяемся припасами. Мне нужны живые союзники.", "Соберём оставшееся золото в одну казну.", "Договоримся о сигналах и ударим согласованно."], "4": ["Казак", "Что приказать экипажу перед атакой на флагман?", "Сберечь людей. Мне нужны те, кто довезёт меня обратно.", "Собрать оставшиеся ценности. Пусть ничего не достанется Эстону.", "Держать огонь на одной цели. Не терять строй в тумане."]};

function openOnlineMenu(){closeOnline();online.active=true;online.generation++;const w=$id('mw');w.replaceChildren();const back=html('button','‹ Главное меню','b menu-back');back.onclick=e=>{e.stopPropagation();menu('home')};w.append(back,html('h1','СЕТЕВАЯ ИГРА'));online.panel=html('section',null,'card kw-online');online.panel.innerHTML='<p class="kw-online-note">Играбельная альфа · полноценный сетевой матч 1v1</p><p data-status role="status">Подключение…</p><div data-forms><label>Ваш ник <input data-nick maxlength="24" placeholder="Казак"></label><hr><h2>Создать комнату</h2><label>Название <input data-name maxlength="60" value="Битва за Кубань"></label><label>Игроки <select data-max><option selected>2</option></select></label><label><input data-private type="checkbox"> Закрытая комната</label><div data-create></div><hr><h2>Подключиться по коду</h2><input data-code maxlength="32" placeholder="Код приглашения"><div data-join></div></div><hr><div data-list></div><div data-refresh></div>';w.append(online.panel);const nickInput=online.panel.querySelector('[data-nick]');nickInput.value=localStorage.getItem('kuban.online.nick')||'Казак';nickInput.onchange=saveNick;online.panel.querySelector('[data-create]').append(lobbyButtons('Создать комнату',()=>rpc('kuban_create_room',{p_name:online.panel.querySelector('[data-name]').value.trim(),p_nickname:saveNick(),p_max_players:2,p_private:online.panel.querySelector('[data-private]').checked})));online.panel.querySelector('[data-join]').append(lobbyButtons('Подключиться',()=>rpc('kuban_join_room',{p_code:online.panel.querySelector('[data-code]').value.trim(),p_nickname:saveNick()})));online.panel.querySelector('[data-refresh]').append(lobbyButtons('Обновить',refreshLobby));guarded(refreshLobby);online.lobbyTimer=setInterval(()=>{if(online.active&&!online.currentMatch&&!online.busy)guarded(refreshLobby)},TICK_ROOM)}

// ---- battle sync ----
const baseSetupMap=setupMap;setupMap=function(ci,opt){if(opt&&opt.seed!=null){const old=Math.random;Math.random=seeded(opt.seed>>>0);try{return baseSetupMap(ci,opt)}finally{Math.random=old;mapSeed=opt.seed>>>0;mapRand=seeded(mapSeed)}}return baseSetupMap(ci,opt)};
const baseAI=ai;ai=function(dt){if(online.currentMatch&&online.role==='host'&&run&&mis?.ci<0)return;return baseAI(dt)};
const baseTick=tick;tick=function(dt){if(online.currentMatch&&online.role==='guest'&&run&&mis?.ci<0){if((fog.t=(fog.t||0)-dt)<=0){fog.t=.1;fog()}return}return baseTick(dt)};
const baseEnd=end;end=function(win){const res=baseEnd(win);if(online.currentMatch&&online.role==='host'){pushFinal(win).catch(err=>console.error(err));cleanupMatchUI()}if(online.currentMatch&&online.role==='guest'){cleanupMatchUI()}return res};
const baseMenu=menu;menu=function(tb='home'){if(!online.suppressMenuClose)closeOnline();const out=baseMenu(tb);if(tb==='o')openOnlineMenu();return out};
function cleanupMatchUI(){clearTimers();online.currentMatch=null;online.role=null;online.lastSnapshot=0;online.lastCommand=0;online.guestBoot=false;online.suppressMenuClose=false;}
function snapshotEntityRef(v){return v&&typeof v==='object'&&v.id!=null&&v.k?{__ref:v.id}:v}
function shallowSanitize(v,seen=new WeakSet()){if(v==null||typeof v!=='object')return v;if(v instanceof HTMLCanvasElement||v instanceof Image||v instanceof Audio||v instanceof HTMLElement)return undefined;if(ArrayBuffer.isView(v))return Array.from(v);if(Array.isArray(v))return v.map(x=>shallowSanitize(snapshotEntityRef(x),seen));if(v.id!=null&&v.k)return {__ref:v.id};if(seen.has(v))return undefined;seen.add(v);const out={};for(const [k,val] of Object.entries(v)){if(typeof val==='function')continue;const s=shallowSanitize(snapshotEntityRef(val),seen);if(s!==undefined)out[k]=s}return out}
function serializeEntity(e){const out={};for(const [k,v] of Object.entries(e)){if(typeof v==='function')continue;const s=shallowSanitize(v);if(s!==undefined)out[k]=s}return out}
function serializeSnapshot(){return {t,mis:{...mis},gold:[...gold],UP:JSON.parse(JSON.stringify(UP)),ARAB:[...ARAB],run,paused,mapSeed,WW,WH,E:E.map(serializeEntity),IT:IT.map(it=>shallowSanitize(it)),FX:FX.map(f=>shallowSanitize(f))}}
function swapPerspectiveSnapshot(s){const c=JSON.parse(JSON.stringify(s));if(c.gold)c.gold=[c.gold[1],c.gold[0]];if(c.UP)c.UP=[c.UP[1],c.UP[0]];if(c.ARAB)c.ARAB=[c.ARAB[1],c.ARAB[0]];if(c.mis){const p=c.mis.p;c.mis.p=c.mis.e;c.mis.e=p;}if(Array.isArray(c.E))for(const e of c.E)if(e.team===0)e.team=1;else if(e.team===1)e.team=0;return c}
function reviveValue(v,map){if(Array.isArray(v))return v.map(x=>reviveValue(x,map));if(v&&typeof v==='object'){const ks=Object.keys(v);if(ks.length===1&&ks[0]==='__ref')return map.get(v.__ref)||null;const out={};for(const [k,val] of Object.entries(v))out[k]=reviveValue(val,map);return out}return v}
function applySnapshot(raw){const snap=online.role==='guest'?swapPerspectiveSnapshot(raw):raw;const wanted=sel?.map?.(u=>u.id)||[];if(snap.mis){if(!mis)window.mis=snap.mis;else Object.assign(mis,snap.mis);document.body.dataset.race=mis.p}t=snap.t||0;gold=Array.isArray(snap.gold)?snap.gold:[0,0];UP=Array.isArray(snap.UP)?snap.UP:[[0,0],[0,0]];ARAB=Array.isArray(snap.ARAB)?snap.ARAB:[0,0];run=!!snap.run;paused=0;const map=new Map();E=(snap.E||[]).map(e=>{const o=reviveValue(e,new Map());map.set(o.id,o);return o});E=E.map(e=>reviveValue(e,map));IT=(snap.IT||[]).map(it=>reviveValue(it,map));FX=(snap.FX||[]).map(f=>reviveValue(f,map));sel=wanted.map(id=>map.get(id)).filter(Boolean);if(!sel.length){const hero=E.find(u=>u.team===0&&!u.dead&&(u.i===9||u.arab));if(hero)sel=[hero]}hud.p='';fog();}
function battleCfgFromMatch(match){const cfg={...DEFAULT_CFG,...(match.config||{})};cfg.seed=(match.config?.seed??cfg.seed)>>>0;return cfg}
function hostPerspectiveSwap(fn){const oldSel=sel, oldPlace=place;for(const e of E){if(e.team===0)e.team=1;else if(e.team===1)e.team=0}if(Array.isArray(gold))[gold[0],gold[1]]=[gold[1],gold[0]];if(Array.isArray(UP))[UP[0],UP[1]]=[UP[1],UP[0]];if(Array.isArray(ARAB))[ARAB[0],ARAB[1]]=[ARAB[1],ARAB[0]];if(mis){const rp=mis.p;mis.p=mis.e;mis.e=rp}try{return fn()}finally{if(mis){const rp=mis.p;mis.p=mis.e;mis.e=rp}if(Array.isArray(ARAB))[ARAB[0],ARAB[1]]=[ARAB[1],ARAB[0]];if(Array.isArray(UP))[UP[0],UP[1]]=[UP[1],UP[0]];if(Array.isArray(gold))[gold[0],gold[1]]=[gold[1],gold[0]];for(const e of E){if(e.team===0)e.team=1;else if(e.team===1)e.team=0}sel=oldSel;place=oldPlace;hud.p='';}}
const originalFns={issue,doPlace,stopU,setSn,train,upg,useAb,slotAct,beginBuildingUpgrade,pbuy,hstat,workerMode,spyRecon,spySabotage,factionAct};
function sendCommand(kind,payload){if(!(online.currentMatch&&online.role==='guest'))return Promise.resolve();return rpc('kuban_submit_command',{p_match_id:online.currentMatch.id,p_kind:kind,p_payload:payload})}
issue=function(wx,wy,am){if(online.currentMatch&&online.role==='guest'&&mis?.ci<0){const ids=sel.filter(u=>u.k==='u'&&u.team===0&&!u.dead).map(u=>u.id);if(!am&&!ids.length){const buildings=sel.filter(b=>b.k==='b'&&b.team===0).map(b=>b.id);if(buildings.length){sendCommand('rally',{ids:buildings,x:wx,y:wy});toast('Точка сбора отправлена');}return}sendCommand('issue',{ids,x:wx,y:wy,am:!!am});FX.push({ty:'r',x:wx,y:wy,rad:14,l:.4,c:'#7f7'});return}return originalFns.issue(wx,wy,am)};
doPlace=function(wx,wy){if(online.currentMatch&&online.role==='guest'&&mis?.ci<0){const ids=sel.filter(u=>u.wk&&u.team===0).map(u=>u.id);if(place?.ty&&ids.length)sendCommand('place',{ids,ty:place.ty,x:wx,y:wy});place=null;return}return originalFns.doPlace(wx,wy)};
stopU=function(us){if(online.currentMatch&&online.role==='guest'&&mis?.ci<0){const ids=(us||[]).filter(u=>u.team===0).map(u=>u.id);if(ids.length)sendCommand('stop',{ids});return}return originalFns.stopU(us)};
setSn=function(m){if(online.currentMatch&&online.role==='guest'&&mis?.ci<0){const ids=sel.filter(u=>u.team===0&&!u.wk).map(u=>u.id);if(ids.length)sendCommand('stance',{ids,mode:m});sel.forEach(u=>{if(u.k=='u'&&u.team==0&&!u.wk){u.formSlot=null;u.sn=m;if(m=='pas'||m=='hold'){u.tg=null;u.auto=0}}});hud.p='';return}return originalFns.setSn(m)};
train=function(b,i){if(online.currentMatch&&online.role==='guest'&&mis?.ci<0){if(b?.id!=null)sendCommand('train',{buildingId:b.id,unit:i});return false}return originalFns.train(b,i)};
upg=function(team,i){if(online.currentMatch&&online.role==='guest'&&mis?.ci<0){sendCommand('upg',{index:i});return false}return originalFns.upg(team,i)};
useAb=function(h,i){if(online.currentMatch&&online.role==='guest'&&mis?.ci<0){if(h?.id!=null)sendCommand('ability',{heroId:h.id,index:i});return false}return originalFns.useAb(h,i)};
slotAct=function(h,sl,mode){if(online.currentMatch&&online.role==='guest'&&mis?.ci<0){if(h?.id!=null)sendCommand('slot',{heroId:h.id,sl,mode});return false}return originalFns.slotAct(h,sl,mode)};
beginBuildingUpgrade=function(b){if(online.currentMatch&&online.role==='guest'&&mis?.ci<0){if(b?.id!=null)sendCommand('buildingUpgrade',{buildingId:b.id});return false}return originalFns.beginBuildingUpgrade(b)};
pbuy=function(h,k){if(online.currentMatch&&online.role==='guest'&&mis?.ci<0){if(h?.id!=null)sendCommand('perk',{heroId:h.id,key:k});return false}return originalFns.pbuy(h,k)};
hstat=function(h,k){if(online.currentMatch&&online.role==='guest'&&mis?.ci<0){if(h?.id!=null)sendCommand('hstat',{heroId:h.id,key:k});return false}return originalFns.hstat(h,k)};
workerMode=function(u,on){if(online.currentMatch&&online.role==='guest'&&mis?.ci<0){if(u?.id!=null)sendCommand('workerMode',{ids:[u.id],on:!!on});return false}return originalFns.workerMode(u,on)};
spyRecon=function(u){if(online.currentMatch&&online.role==='guest'&&mis?.ci<0){if(u?.id!=null)sendCommand('spyRecon',{unitId:u.id});return false}return originalFns.spyRecon(u)};
spySabotage=function(u){if(online.currentMatch&&online.role==='guest'&&mis?.ci<0){if(u?.id!=null)sendCommand('spySabotage',{unitId:u.id});return true}return originalFns.spySabotage(u)};
factionAct=function(team,key){if(online.currentMatch&&online.role==='guest'&&mis?.ci<0&&team===0){sendCommand('faction',{key});return false}return originalFns.factionAct(team,key)};
function applyHostCommand(kind,payload){hostPerspectiveSwap(()=>{switch(kind){case 'issue':{sel=E.filter(u=>payload.ids?.includes(u.id));originalFns.issue(payload.x,payload.y,payload.am?1:0);break}case 'place':{sel=E.filter(u=>payload.ids?.includes(u.id));place={ty:payload.ty};originalFns.doPlace(payload.x,payload.y);break}case 'stop':{originalFns.stopU(E.filter(u=>payload.ids?.includes(u.id)));break}case 'stance':{sel=E.filter(u=>payload.ids?.includes(u.id));originalFns.setSn(payload.mode);if(payload.mode==='hold')sel.forEach(u=>{if(!u.wk){u.o='i';u.am=null;u.tg=null}});break}case 'train':{const b=E.find(e=>e.id===payload.buildingId);if(b)originalFns.train(b,payload.unit);break}case 'upg':originalFns.upg(0,payload.index);break;case 'ability':{const h=E.find(e=>e.id===payload.heroId);if(h)originalFns.useAb(h,payload.index);break}case 'slot':{const h=E.find(e=>e.id===payload.heroId);if(h)originalFns.slotAct(h,payload.sl,payload.mode);break}case 'buildingUpgrade':{const b=E.find(e=>e.id===payload.buildingId);if(b)originalFns.beginBuildingUpgrade(b);break}case 'perk':{const h=E.find(e=>e.id===payload.heroId);if(h)originalFns.pbuy(h,payload.key);break}case 'hstat':{const h=E.find(e=>e.id===payload.heroId);if(h)originalFns.hstat(h,payload.key);break}case 'workerMode':{for(const id of payload.ids||[]){const u=E.find(e=>e.id===id);if(u)originalFns.workerMode(u,!!payload.on)}break}case 'rally':{sel=E.filter(e=>payload.ids?.includes(e.id));setRally(payload.x,payload.y);break}case 'spyRecon':{const u=E.find(e=>e.id===payload.unitId);if(u)originalFns.spyRecon(u);break}case 'spySabotage':{const u=E.find(e=>e.id===payload.unitId);if(u)originalFns.spySabotage(u);break}case 'faction':originalFns.factionAct(0,payload.key);break;default:break}})}
async function pullCommands(){if(!(online.currentMatch&&online.role==='host'&&run))return;const rows=await get('kuban_match_commands?select=id,kind,payload,sender_id&match_id=eq.'+encodeURIComponent(online.currentMatch.id)+'&id=gt.'+online.lastCommand+'&order=id.asc');for(const row of rows){online.lastCommand=row.id;applyHostCommand(row.kind,row.payload||{})}}
async function pushSnapshot(){if(!(online.currentMatch&&online.role==='host'&&run))return;const snap=serializeSnapshot();await rpc('kuban_push_snapshot',{p_match_id:online.currentMatch.id,p_snapshot:snap})}
async function pushFinal(win){if(!(online.currentMatch&&online.role==='host'))return;const snap=serializeSnapshot();await rpc('kuban_push_snapshot',{p_match_id:online.currentMatch.id,p_snapshot:snap,p_status:'finished',p_result:{winner:win?'host':'guest',time:t}})}
function startHostedMatch(match){const cfg=battleCfgFromMatch(match);online.suppressMenuClose=true;online.currentMatch=match;online.role='host';online.lastCommand=0;online.lastSnapshot=0;start(cfg.hostRace,cfg.guestRace,1,-1,{g:+cfg.gold||600,n:cfg.neutral!==false,size:+cfg.size||1,biome:cfg.biome||'random',seed:cfg.seed});toast('Сетевой бой начался. Ты — хост.');clearTimers();online.commandTimer=setInterval(()=>pullCommands().catch(err=>console.error(err)),PULL_COMMANDS);online.snapshotTimer=setInterval(()=>pushSnapshot().catch(err=>console.error(err)),PUSH_SNAPSHOT);pushSnapshot().catch(err=>console.error(err));}
function startGuestMatch(match){const cfg=battleCfgFromMatch(match);online.suppressMenuClose=true;online.currentMatch=match;online.role='guest';online.lastSnapshot=0;online.guestBoot=true;start(cfg.hostRace,cfg.guestRace,1,-1,{g:+cfg.gold||600,n:cfg.neutral!==false,size:+cfg.size||1,biome:cfg.biome||'random',seed:cfg.seed});toast('Сетевой бой начался. Ты подключён как второй игрок.');clearTimers();online.matchTimer=setInterval(()=>pollMatch().catch(err=>console.error(err)),TICK_MATCH);}
async function pollMatch(){if(!(online.currentMatch&&online.role==='guest'))return;const rows=await get('kuban_matches?select=id,status,snapshot,snapshot_version,result&id=eq.'+encodeURIComponent(online.currentMatch.id));const row=rows[0];if(!row)return;if(row.snapshot_version>online.lastSnapshot&&row.snapshot){online.lastSnapshot=row.snapshot_version;applySnapshot(row.snapshot)}if(row.status==='finished'&&row.result){clearTimers();const gw=row.result.winner==='guest';const restore=online.suppressMenuClose;online.currentMatch=null;online.role=null;online.suppressMenuClose=restore;baseEnd(gw?1:0);online.suppressMenuClose=false;}}
function enterMatch(match,room,players){if(online.currentMatch&&online.currentMatch.id===match.id)return;online.currentMatch=match;const isHost=match.host_id===online.session.user.id;setStatus('Матч запущен. Входим в бой…');if(isHost)startHostedMatch(match);else startGuestMatch(match);}
